# .github/workflows/ci.yml
# Pipeline de Integração Contínua — TaskFlow Manager
# Executado automaticamente a cada push ou pull request para a branch main
# Garante que todos os testes passem antes de mesclar código

name: CI — TaskFlow Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Executar Testes com PyTest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]  # Testa em múltiplas versões do Python

    steps:
      # Passo 1: Baixa o código do repositório
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # Passo 2: Configura a versão do Python
      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"  # Cache das dependências para builds mais rápidos

      # Passo 3: Instala as dependências do projeto
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Passo 4: Verifica qualidade do código com Flake8 (linter)
      - name: 🔍 Verificar qualidade do código (Flake8)
        run: |
          pip install flake8
          flake8 src/ tests/ --max-line-length=120 --exclude=__pycache__

      # Passo 5: Executa todos os testes com PyTest e gera relatório de cobertura
      - name: 🧪 Executar testes com PyTest
        run: |
          pip install pytest-cov
          pytest tests/ --tb=short -v --cov=src --cov-report=xml --cov-report=term-missing

      # Passo 6: Publica o relatório de cobertura (opcional, requer configuração)
      - name: 📊 Publicar relatório de cobertura
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false  # Não falha o CI se o Codecov estiver indisponível
